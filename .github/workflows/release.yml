name: Build and Release Firmware

# Runs on every push of a version tag (e.g. "git tag v1.2.3 && git push --tags").
# Builds main/BaseStation for ESP32-P4 (once per supported display board -
# see main/Kconfig.projbuild) and main/Sensor-Receiver for ESP32-S3 in
# parallel jobs and attaches all firmwares as assets to a shared GitHub
# release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed so the action can create/describe a GitHub release

jobs:
  # Same steps for both display boards, only the SDKCONFIG_DEFAULTS overlay
  # and the output file names differ - see main/Kconfig.projbuild for why
  # this needs two separate builds instead of one binary that works on both
  # (different touch controller/backlight/GPIOs, selected at compile time).
  # Each job's container is a fresh checkout, so there's never a stale
  # sdkconfig around to make the SDKCONFIG_DEFAULTS overlay a no-op (see
  # the "sdkconfig.defaults* only seeds a NEW sdkconfig" note in
  # sdkconfig.defaults.guition).
  build-basestation-waveshare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Forces a fresh component download every run, independent of
      # whatever the runner's workspace still has lying around from a
      # previous job (matters on non-ephemeral/self-hosted runners - a
      # stale managed_components/ has caused both version drift on
      # unpinned components and hash-mismatch errors on pinned ones).
      - name: Clean stale component cache
        run: rm -rf BaseStation/managed_components BaseStation/build

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32p4
          path: BaseStation
          command: idf.py -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.waveshare" build

      # Own folder + unique file names: BaseStation-waveshare, BaseStation-
      # guition and Sensor-Receiver all produce "bootloader.bin"/
      # "partition-table.bin" - without renaming, the artifact sets would
      # overwrite each other on release upload.
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp BaseStation/build/Basestation.bin artifacts/Basestation-waveshare.bin
          cp BaseStation/build/bootloader/bootloader.bin artifacts/Basestation-waveshare-bootloader.bin
          cp BaseStation/build/partition_table/partition-table.bin artifacts/Basestation-waveshare-partition-table.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: basestation-waveshare-firmware
          path: artifacts/

  build-basestation-guition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean stale component cache
        run: rm -rf BaseStation/managed_components BaseStation/build

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32p4
          path: BaseStation
          command: idf.py -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.guition" build

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp BaseStation/build/Basestation.bin artifacts/Basestation-guition.bin
          cp BaseStation/build/bootloader/bootloader.bin artifacts/Basestation-guition-bootloader.bin
          cp BaseStation/build/partition_table/partition-table.bin artifacts/Basestation-guition-partition-table.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: basestation-guition-firmware
          path: artifacts/

  build-receiver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See "Clean stale component cache" above - same reasoning, this is
      # what was hitting the u8g2 hash-mismatch error.
      - name: Clean stale component cache
        run: rm -rf Sensor-Receiver/managed_components Sensor-Receiver/build

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: Sensor-Receiver

      # Build output is named SENSOR_RECEIVER.bin (project name) - renamed
      # here to "Receiver.bin" because both BaseStation/main/ota/ota_task.c
      # (RECEIVER_OTA_ASSET_NAME) and Sensor-Receiver/main/ota/ota_task.c
      # (OTA_ASSET_NAME) expect exactly this asset name in the GitHub release.
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp Sensor-Receiver/build/SENSOR_RECEIVER.bin artifacts/Receiver.bin
          cp Sensor-Receiver/build/bootloader/bootloader.bin artifacts/Receiver-bootloader.bin
          cp Sensor-Receiver/build/partition_table/partition-table.bin artifacts/Receiver-partition-table.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: receiver-firmware
          path: artifacts/

  release:
    needs: [build-basestation-waveshare, build-basestation-guition, build-receiver]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/basestation-waveshare-firmware/*
            artifacts/basestation-guition-firmware/*
            artifacts/receiver-firmware/*
