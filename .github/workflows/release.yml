name: Build and Release BaseStation Firmware

# Laeuft bei jedem Push eines Versions-Tags (z.B. "git tag v1.2.3 && git push --tags").
# Baut main/BaseStation fuer ESP32-P4 und haengt die Firmware als Release-Assets an.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # noetig, damit die Action ein GitHub Release erstellen/beschreiben darf

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32p4
          path: BaseStation

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            BaseStation/build/Basestation.bin
            BaseStation/build/bootloader/bootloader.bin
            BaseStation/build/partition_table/partition-table.bin
