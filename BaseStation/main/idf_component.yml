## IDF Component Manager Manifest File
##
## Only espressif and lvgl components are used.
##
dependencies:
  idf:
    version: '>=6.0.2'
    
  ## LVGL 8.x graphics library
  lvgl/lvgl:
    version: "9.5.*"

  ## ESP LVGL Port - integrates LVGL with ESP-IDF
  ## Handles LVGL task, display driver, touch input
  ##
  ## Pinned to an EXACT version (not "^2"): esp_lvgl_port >2.8.0~1 changed
  ## esp_lcd_dpi_panel_event_callbacks_t usage (on_frame_buf_complete) in a
  ## way that's incompatible with the esp_lcd DPI panel API shipped in the
  ## pinned ESP-IDF v6.0.2 - "^2" lets the resolver pick that newer,
  ## broken-for-us release as soon as it's published, with no code change
  ## on our side to explain the sudden build failure.
  espressif/esp_lvgl_port:
    version: "2.8.0~1"

  ## GT911 capacitive touch controller driver
  espressif/esp_lcd_touch_gt911:
    version: "^1"

  ## JD9365 MIPI DSI LCD panel driver (handles DBI commands + DPI panel)
  espressif/esp_lcd_jd9365:
    version: "^2"

  ## ESP32-P4 has no native Wi-Fi radio: these route the esp_wifi API to the
  ## ESP32-C6 co-processor over the ESP-Hosted transport (SDIO/SPI).
  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"

  espressif/esp_hosted:
    version: "~2"

